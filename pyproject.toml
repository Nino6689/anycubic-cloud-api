[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anycubic-cloud-api"
version = "0.4.33"
description = "Async client for the Anycubic Cloud API and its MQTT stream"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
# Most of this library originated in WaresWichall's Home Assistant
# integration; it is extracted, modified and extended here. See the
# attribution section of the README.
authors = [
    { name = "WaresWichall" },
    { name = "Nino Bondonno" },
]
maintainers = [
    { name = "Nino Bondonno" },
]
keywords = ["anycubic", "3d-printing", "kobra", "photon", "homeassistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "paho-mqtt>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/Nino6689/anycubic-cloud-api"
Issues = "https://github.com/Nino6689/anycubic-cloud-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The MQTT broker requires mutual TLS using Anycubic's own certificates, so
# they must ship inside the wheel -- the client cannot connect without them.
anycubic_cloud_api = ["resources/*.crt", "resources/*.key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Only tests are linted in CI. src/ predates any ruff config and reports 291
# findings under stock defaults nobody chose -- all style, no bugs -- so
# enforcing them now would either land CI red or bury real changes in a
# repo-wide reformat.
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Test fixtures are data, and these two rules are about production hygiene:
# a shared dict literal on a stub class is the point, not a mistake.
"tests/*" = ["RUF012", "C408"]


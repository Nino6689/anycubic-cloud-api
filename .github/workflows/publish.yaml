name: Publish

# Releases are built and uploaded here, from the tagged commit, rather than
# from a laptop. Home Assistant's dependency-transparency rule asks for exactly
# that: every version on PyPI built by a public pipeline from a tagged release.
# Uploads use PyPI trusted publishing, so no token is stored anywhere.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag must name the version being built
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
          pytest tests -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # The MQTT client cannot connect without these, and a packaging slip
      # would ship a release that installs cleanly and then never connects.
      - name: The TLS resources must be in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          missing = [s for s in (".crt", ".key") if not any(n.startswith("anycubic_cloud_api/resources/") and n.endswith(s) for n in names)]
          if missing:
              print(f"::error::wheel is missing resources/*{missing}")
              sys.exit(1)
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
